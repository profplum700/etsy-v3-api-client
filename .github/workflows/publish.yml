name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    concurrency:
      group: package-publish
      cancel-in-progress: false
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate MCP Registry metadata version
        run: pnpm run check:registry-metadata

      - name: Confirm this is still the latest master commit
        id: freshness
        uses: actions/github-script@v8
        with:
          script: |
            const current = context.payload.workflow_run;
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "master",
            });
            const isCurrent = branch.data.commit.sha === current.head_sha;
            core.setOutput("is_current", String(isCurrent));
            if (!isCurrent) {
              core.notice(`Skipping stale publish candidate ${current.head_sha}; master is now ${branch.data.commit.sha}.`);
            }

      - name: Find previous successful package publish
        id: base
        if: steps.freshness.outputs.is_current == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const current = context.payload.workflow_run;
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "publish.yml",
              branch: "master",
              event: "workflow_run",
              status: "success",
              per_page: 100,
            });
            const previous = response.data.workflow_runs
              .filter((run) => run.id < context.runId && run.head_sha !== current.head_sha)
              .sort((left, right) => right.id - left.id)[0];
            let baseSha = previous?.head_sha;
            if (!baseSha) {
              const commit = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: current.head_sha,
              });
              baseSha = commit.data.parents[0]?.sha ?? current.head_sha;
            }
            core.setOutput("sha", baseSha);

      - name: Identify package version changes
        id: versions
        if: steps.freshness.outputs.is_current == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSIONS_FILE: ${{ runner.temp }}/etsy-package-versions.json
        run: node scripts/changed-package-versions.mjs "$BASE_SHA" "$HEAD_SHA" | tee "$VERSIONS_FILE"

      - name: Publish changed npm packages
        if: steps.freshness.outputs.is_current == 'true' && steps.versions.outputs.changed_packages != '[]'
        run: pnpm run release:packages

      - name: Push package-specific Changesets tags
        if: steps.freshness.outputs.is_current == 'true' && steps.versions.outputs.changed_packages != '[]'
        env:
          VERSIONS_FILE: ${{ runner.temp }}/etsy-package-versions.json
        run: node scripts/push-changeset-tags.mjs "$VERSIONS_FILE"

      - name: Install Cosign
        if: steps.freshness.outputs.is_current == 'true' && steps.versions.outputs.mcp_changed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify MCP Registry publisher
        if: steps.freshness.outputs.is_current == 'true' && steps.versions.outputs.mcp_changed == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity-regexp "^https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar -xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Verify the MCP package is published to npm
        if: steps.freshness.outputs.is_current == 'true' && steps.versions.outputs.mcp_changed == 'true'
        run: node scripts/verify-mcp-published.mjs

      - name: Validate MCP Registry metadata
        if: steps.freshness.outputs.is_current == 'true' && steps.versions.outputs.mcp_changed == 'true'
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry with GitHub OIDC
        if: steps.freshness.outputs.is_current == 'true' && steps.versions.outputs.mcp_changed == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Registry metadata
        if: steps.freshness.outputs.is_current == 'true' && steps.versions.outputs.mcp_changed == 'true'
        run: ./mcp-publisher publish
