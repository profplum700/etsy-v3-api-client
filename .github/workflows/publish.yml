name: Publish

on:
  push:
    tags:
      - '@profplum700/**'

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/@profplum700/')
    runs-on: ubuntu-latest
    concurrency:
      group: package-publish-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - name: Checkout the tagged release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Validate release tag and package version
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/resolve-release-tag.mjs "$RELEASE_TAG"

      - name: Require successful CI on this master commit
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "master",
              head_sha: context.sha,
              status: "success",
              per_page: 100,
            });
            const verified = runs.data.workflow_runs.some((run) =>
              run.event === "push" && run.head_branch === "master" &&
              run.head_sha === context.sha && run.conclusion === "success"
            );
            if (!verified) {
              core.setFailed(`No successful master CI run exists for tagged commit ${context.sha}.`);
              return;
            }
            core.info(`CI verified tagged commit ${context.sha}.`);

      - name: Require tagged commit to be part of master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the verified workspace
        run: pnpm run build

      - name: Pack the selected package
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.package_directory }}
        run: pnpm --dir "$PACKAGE_DIRECTORY" pack --pack-destination "$RUNNER_TEMP"

      - name: Require npm Trusted Publishing CLI support
        run: |
          NPM_VERSION="$(npm --version)" node -e 'const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)'

      - name: Publish selected package with npm Trusted Publishing
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/*.tgz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected one package archive, found ${#archives[@]}." >&2
            exit 1
          fi
          npm publish "${archives[0]}" --access public

      - name: Verify the MCP package is published to npm
        if: steps.package.outputs.mcp_changed == 'true'
        run: node scripts/verify-mcp-published.mjs

      - name: Install Cosign
        if: steps.package.outputs.mcp_changed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify MCP Registry publisher
        if: steps.package.outputs.mcp_changed == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity-regexp "^https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar -xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate MCP Registry metadata
        if: steps.package.outputs.mcp_changed == 'true'
        run: |
          pnpm run check:registry-metadata
          ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry with GitHub OIDC
        if: steps.package.outputs.mcp_changed == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Registry metadata
        if: steps.package.outputs.mcp_changed == 'true'
        run: ./mcp-publisher publish
