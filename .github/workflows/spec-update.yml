name: Etsy specification updates
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Exercise a disposable synthetic draft PR, then close it
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: etsy-specification-update
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'profplum700/etsy-v3-api-client' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/spec/automation.mjs
        if: inputs.rehearsal != true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/spec/rehearsal.mjs
        if: inputs.rehearsal == true
        env:
          GH_TOKEN: ${{ github.token }}
