name: Etsy specification updates
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Exercise a disposable synthetic draft PR, then close it
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: etsy-specification-update
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'profplum700/etsy-v3-api-client' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/spec/automation.mjs
        if: inputs.rehearsal != true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/spec/rehearsal.mjs
        if: inputs.rehearsal == true
        env:
          GH_TOKEN: ${{ github.token }}
